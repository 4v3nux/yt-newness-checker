<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 12px;
      background-color: #0f0f0f;
      color: #f1f1f1;
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 14px;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      border-bottom: 1px solid #272727;
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #count {
      background: #3ea6ff;
      color: #0f0f0f;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 350px;
      overflow-y: auto;
    }
    li {
      margin-bottom: 4px;
    }
    a {
      display: flex;
      align-items: center;
      padding: 8px;
      color: #f1f1f1;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.15s;
    }
    a:hover {
      background-color: #272727;
    }
    .dot {
      width: 6px;
      height: 6px;
      background-color: #3ea6ff;
      border-radius: 50%;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .status {
      color: #aaaaaa;
      font-size: 13px;
      text-align: center;
      padding: 15px 0;
    }
  </style>
</head>
<body>
  <h3>Новые видео <span id="count">0</span></h3>
  <div id="content" class="status">Сканирование...</div>
  <script src="popup.js"></script>
</body>
</html>
